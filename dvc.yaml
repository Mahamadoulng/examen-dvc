stages:
  split:
    cmd: python3 src/scripts/read_split.py data/raw/raw.csv
    deps:
    - data/raw/raw.csv
    - src/scripts/read_split.py
    outs:
    - data/processed_data/X_test.csv
    - data/processed_data/X_train.csv
    - data/processed_data/y_test.csv
    - data/processed_data/y_train.csv
  normalize:
    cmd: python3 src/scripts/normalize.py
    deps:
    - data/processed_data/X_test.csv
    - data/processed_data/X_train.csv
    - src/scripts/normalize.py
    outs:
    - data/processed_data/X_test_scaled.csv
    - data/processed_data/X_train_scaled.csv
  gridsearch:
    cmd: python3 src/scripts/grid_search.py
    deps:
    - data/processed_data/X_train_scaled.csv
    - data/processed_data/y_train.csv
    - src/scripts/grid_search.py
    outs:
    - models/best_params.pkl
  train:
    cmd: python3 src/scripts/train_model.py
    deps:
    - data/processed_data/X_train_scaled.csv
    - data/processed_data/y_train.csv
    - models/best_params.pkl
    - src/scripts/train_model.py
    outs:
    - models/model.pkl
