# param.yaml
split:
  raw_data: data/raw/raw.csv      
  test_size: 0.2
  random_state: 42

gridsearch:
  X_train: data/processed_data/X_train_scaled.csv
  y_train: data/processed_data/y_train.csv
  # espace de recherche (référence)
  n_estimators: [50, 100, 200]
  max_depth:    [null, 5, 10]
  min_samples_split: [2, 5]
  min_samples_leaf:  [1, 2]
